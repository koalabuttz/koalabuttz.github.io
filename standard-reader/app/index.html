<!DOCTYPE html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>standard-reader (web)</title>

<script type="module">
import init, * as bindings from '/standard-reader/app/standard-reader-web-77db6a4d24ec9e7c.js';
const wasm = await init({ module_or_path: '/standard-reader/app/standard-reader-web-77db6a4d24ec9e7c_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        /* The reader fills the page; nothing should scroll (arrows/space drive the reader). */
        overflow: hidden;
        background: #121212;
        color: #ddd;
      }
      /* ratzilla's DomBackend renders each terminal row as a <pre>; the browser's default
         `pre` margin inserts a gap between every row (the "black lines"). margin:0 +
         line-height:1 make the rows contiguous. */
      pre {
        margin: 0;
        font-family: ui-monospace, "Cascadia Code", "Fira Code", Menlo, Consolas, monospace;
        font-size: 16px;
        line-height: 1;
      }
    </style>
  <link rel="modulepreload" href="/standard-reader/app/standard-reader-web-77db6a4d24ec9e7c.js" crossorigin="anonymous" integrity="sha384-zZWHZLD0tHgm3nH/DjzMIPxZGHTWofsbo2vN8azPpiN1bdNnkmLAEGwIbRiJzl9u"><link rel="modulepreload" href="/standard-reader/app/snippets/standard-reader-web-f74e35292c5f2e76/inline0.js" crossorigin="anonymous" integrity="sha384-3jj4hjF+ebeVFmEEx6/vmoLHz5ZdjBUNuCTSnb7LDH4mXYk6kFpTx0TeFFZetrO7"><link rel="preload" href="/standard-reader/app/standard-reader-web-77db6a4d24ec9e7c_bg.wasm" crossorigin="anonymous" integrity="sha384-FvgFgYLvy9mOeyWek95PnqA1OnW4Vv4mLkGynVHPpvUGMvohwSD01Bymdwdq81zs" as="fetch" type="application/wasm"></head>
  <body>
    <script>
      // The reader's OPFS cache preserves publications and images. The app-scoped service worker
      // preserves the HTML/JS/WASM shell too, so a previously opened reader can start offline.
      if ("serviceWorker" in navigator && window.isSecureContext) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch((error) => {
            console.warn("standard-reader service worker registration failed", error);
          });
        });
      }
    </script>
  </body>
</html>
